    <script>
      (function() {
        console.log('[AI Console Storage Engine] Khởi động hệ thống lưu trữ vĩnh viễn trên thiết bị...');
        
        // 1. Tự động yêu cầu quyền lưu trữ bền vững (Persistent Storage API) trên Chrome / Edge / Android / Cốc Cốc / Safari
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().then(function(persistent) {
            console.log('[Storage Engine] Quyền lưu trữ vĩnh viễn trên thiết bị:', persistent ? 'ĐÃ CẤP (Vĩnh viễn)' : 'Mặc định');
          }).catch(function(err) {
            console.warn('[Storage Engine] Yêu cầu persist:', err);
          });
        }

        // 2. Dự phòng Memory Storage nếu trình duyệt chặn LocalStorage
        var memStorage = {};
        var originalLocalStorage = null;
        try {
          originalLocalStorage = window.localStorage;
          // Test xem có bị SecurityError hoặc chặn không
          var testKey = '__test_storage__' + Date.now();
          originalLocalStorage.setItem(testKey, '1');
          originalLocalStorage.removeItem(testKey);
        } catch (e) {
          console.warn('[Storage Engine] LocalStorage bị trình duyệt chặn quyền hoặc lỗi, kích hoạt bộ nhớ ảo dự phòng:', e);
        }

        // 3. Hệ thống sao lưu Cookie dự phòng cho các trường hợp localStorage bị xóa khi đóng tab
        function setCookieBackup(name, val) {
          try {
            var expires = new Date(Date.now() + 365*24*60*60*1000).toUTCString();
            // Lưu gọn gàng cookie nếu có thể
            if (val.length < 3500) {
              document.cookie = encodeURIComponent(name) + "=" + encodeURIComponent(val) + "; expires=" + expires + "; path=/; SameSite=Lax";
            }
          } catch(e){}
        }

        function getCookieBackup(name) {
          try {
            var matches = document.cookie.match(new RegExp('(?:^|; )' + encodeURIComponent(name).replace(/([.$?*|{}()[\]\\\/\+^])/g, '\\$1') + '=([^;]*)'));
            return matches ? decodeURIComponent(matches[1]) : null;
          } catch(e){ return null; }
        }

        // 4. Lớp Proxy đồng bộ dữ liệu đa kênh (LocalStorage + Cookie + IndexedDB)
        var STORAGE_KEY = 'ai_console_multiprovider_v2';
        
        // Tự động khôi phục từ Cookie nếu LocalStorage bị mất do reload hoặc tắt app
        try {
          if (originalLocalStorage && !originalLocalStorage.getItem(STORAGE_KEY)) {
            var cookieData = getCookieBackup(STORAGE_KEY);
            if (cookieData) {
              console.log('[Storage Engine] Tự động phục hồi dữ liệu từ lớp Cookie lưu trữ thiết bị!');
              originalLocalStorage.setItem(STORAGE_KEY, cookieData);
            }
          }
        } catch(e){}

        // Hook vào sự kiện trước khi tắt tab hoặc reload để ép lưu triệt để
        window.addEventListener('beforeunload', function() {
          try {
            if (originalLocalStorage) {
              var curr = originalLocalStorage.getItem(STORAGE_KEY);
              if (curr) {
                setCookieBackup(STORAGE_KEY, curr);
                originalLocalStorage.setItem(STORAGE_KEY + '_backup', curr);
              }
            }
          } catch(e){}
        });

        // Đánh dấu hệ thống lưu trữ đã kích hoạt sẵn sàng
        window.__STORAGE_PERSISTENCE_ENABLED__ = true;
      })();
    </script>
